<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>私のランキング ONLINE</title><style>
:root{--bg:#f6f0e7;--paper:#fffdf8;--ink:#2e2924;--muted:#746b61;--line:#d8cabb;--accent:#8f5b3e;--gold:#d7a72d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff9ee,var(--bg));color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px}.top{text-align:center;padding:8px 0 18px}.top h1{margin:0;font-size:clamp(26px,5vw,44px)}.ver{font-size:12px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #5b463018}.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.room{display:grid;gap:8px}.room h2{margin:0}.status{font-size:12px;color:var(--muted)}button,input,select{font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.outline{background:white;border:1px solid var(--line)}.danger{background:#7d3636;color:white}.btn:disabled{opacity:.4}.name{max-width:500px;margin:0 auto 16px}.name input,.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.players{display:grid;gap:7px}.player{padding:10px 12px;border-radius:12px;background:#f4ece2;display:flex;justify-content:space-between}.fields{display:grid;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.gamehead{display:flex;justify-content:space-between;gap:12px;align-items:center}.question{text-align:center;font-size:clamp(23px,5vw,40px);font-weight:900;margin:22px 0}.parent{text-align:center;color:var(--muted)}.ranklist{max-width:650px;margin:auto;display:grid;gap:9px}.rankrow{display:grid;grid-template-columns:58px 1fr 70px 70px;gap:8px;align-items:center;background:#f7efe5;border:1px solid var(--line);padding:10px;border-radius:14px}.rankno{font-size:21px;font-weight:900;text-align:center}.rankname{font-weight:800}.small{padding:7px 8px}.candidate-inputs{max-width:650px;margin:auto;display:grid;gap:9px}.candidate-inputs input{padding:13px;border:1px solid var(--line);border-radius:10px}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}.score{background:#f4ece2;padding:10px;border-radius:12px;text-align:center}.score b{display:block;font-size:24px}.waiting{text-align:center;padding:20px;color:var(--muted)}.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer-card{border:1px solid var(--line);border-radius:14px;padding:12px}.answer-card h3{margin-top:0}.match{font-weight:900;color:#a06900}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2d2823;color:white;padding:11px 18px;border-radius:999px;z-index:9;display:none}.winner{text-align:center;font-size:32px;font-weight:900;padding:20px}.help{font-size:13px;color:var(--muted);line-height:1.7}@media(max-width:760px){.wrap{padding:8px}.rooms{grid-template-columns:repeat(2,1fr);gap:8px}.panel{padding:12px;border-radius:14px}.lobby-grid,.reveal-grid{grid-template-columns:1fr}.rankrow{grid-template-columns:42px 1fr 52px 52px;padding:8px}.btn{padding:10px 9px}.top{padding-bottom:10px}}
</style></head><body><div class="wrap"><header class="top"><h1>私のランキング ONLINE</h1><div class="ver">v0.1.4</div></header><main id="app"></main></div><div id="toast" class="toast"></div><script>
const WORKER_ORIGIN='https://my-ranking-online.naitoryo7110.workers.dev';const NAME_KEY='boardgamePlayerName',NAME_DRAFT_KEY='my-ranking-name-draft',ROOMS=['room1','room2','room3','room4'];let rooms=[],room=null,ws=null,currentRoom=null,currentName='',draft=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function tokenKey(id){return'my-ranking-token-'+id}function getToken(id){let t=localStorage.getItem(tokenKey(id));if(!t){t=crypto.randomUUID().replaceAll('-','');localStorage.setItem(tokenKey(id),t)}return t}function wsOrigin(){return WORKER_ORIGIN.replace(/^http/,'ws')}
async function loadRooms(){try{let r=await fetch(WORKER_ORIGIN+'/rooms',{cache:'no-store'}),d=await r.json();rooms=d.rooms||[];if(!currentRoom){let liveName=$('#name')?.value;renderHome(liveName)}}catch(e){toast('部屋情報を取得できません')}}
function renderHome(preserveName){let name=preserveName??(sessionStorage.getItem(NAME_DRAFT_KEY)??localStorage.getItem(NAME_KEY)??'');$('#app').innerHTML=`<section class="panel"><div class="name field"><label>プレイヤー名</label><input id="name" maxlength="18" value="${esc(name)}"></div><div class="rooms">${ROOMS.map((id,i)=>{let r=rooms.find(x=>x.id===id)||{status:'lobby',players:0,maxPlayers:10,participants:[],connectedHumans:0};let reconnect=localStorage.getItem(tokenKey(id))&&r.status!=='lobby';return`<article class="room"><h2>ROOM ${i+1}</h2><div class="status">${r.status==='playing'?'ゲーム中':r.status==='finished'?'終了':'待機中'} ・ ${r.players}/${r.maxPlayers}人</div><div class="status">${esc((r.participants||[]).join('、')||'参加者なし')}</div><button class="btn primary" data-join="${id}" ${r.status==='lobby'||reconnect?'':'disabled'}>${reconnect?'再接続':'参加'}</button><button class="btn outline" data-reset="${id}" ${r.connectedHumans===0?'':'disabled'}>初期化</button></article>`}).join('')}</div><p class="help">空ROOMを最初に作成できるのは共通HOMEで許可されたホスト名だけです。既存ROOMへの参加にはホスト権限は不要です。</p></section>`;$('#name').oninput=e=>sessionStorage.setItem(NAME_DRAFT_KEY,e.target.value);document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{let n=$('#name').value.trim();if(!n)return toast('名前を入力してください');connect(b.dataset.join,n)});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetRoom(b.dataset.reset))}
async function resetRoom(id){if(!confirm('このROOMを初期化しますか？'))return;let r=await fetch(`${WORKER_ORIGIN}/rooms/${id}/reset-empty`,{method:'POST'}),d=await r.json();if(!r.ok)return toast(d.error||'初期化できません');loadRooms()}
async function connect(id,name){currentRoom=id;currentName=name;let t=getToken(id);try{let c=await fetch(`${WORKER_ORIGIN}/rooms/${id}/join-check?name=${encodeURIComponent(name)}&token=${t}`),d=await c.json();if(!c.ok)throw Error(d.error);ws=new WebSocket(`${wsOrigin()}/ws/${id}?name=${encodeURIComponent(name)}&token=${t}`);ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error')toast(d.error);if(d.room){let old=room;room=d.room;if(!old?.game&&room.game){localStorage.setItem(NAME_KEY,currentName);sessionStorage.removeItem(NAME_DRAFT_KEY)}render()}};ws.onclose=()=>{if(currentRoom)setTimeout(()=>connect(currentRoom,currentName),1800)}}catch(e){toast(e.message);currentRoom=null;loadRooms()}}
function send(type,action,payload={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,action,payload}))}
function render(){if(!room)return;if(room.status==='lobby')return renderLobby();renderGame()}
function renderLobby(){let s=room.settings,roundField=s.endType==='round'?`<div class="field"><label>ラウンド数</label><input id="rounds" type="number" min="1" max="99" value="${s.rounds}" ${room.isHost?'':'disabled'}></div>`:`<div class="field"><label>目標得点</label><input id="target" type="number" min="1" max="999" value="${s.target}" ${room.isHost?'':'disabled'}></div>`;$('#app').innerHTML=`<section class="panel"><div class="gamehead"><h2>ROOM ${ROOMS.indexOf(room.roomId)+1} ロビー</h2><button id="leave" class="btn outline">退室</button></div><div class="lobby-grid"><div><h3>参加者 ${room.players.length}/10</h3><div class="players">${room.players.map(p=>`<div class="player"><span>${p.isHost?'👑 ':''}${esc(p.name)}</span><span>${p.connected?'接続中':'切断'}</span></div>`).join('')}</div></div><div class="fields"><div class="field"><label>終了条件</label><select id="endType" ${room.isHost?'':'disabled'}><option value="round" ${s.endType==='round'?'selected':''}>ラウンド制</option><option value="score" ${s.endType==='score'?'selected':''}>得点制</option></select></div>${roundField}<div class="field"><label>出題方式</label><select id="mode" ${room.isHost?'':'disabled'}><option value="full" ${s.questionMode==='full'?'selected':''}>完全ランダム</option><option value="topic" ${s.questionMode==='topic'?'selected':''}>お題だけランダム</option></select></div>${room.isHost?'<button id="start" class="btn primary">ゲーム開始</button>':'<div class="waiting">ホストの開始を待っています</div>'}</div></div></section>`;$('#leave').onclick=()=>{send('lobby','leave');currentRoom=null;room=null;try{ws.close()}catch{}loadRooms()};if(room.isHost){let update=()=>send('lobby','settings',{endType:$('#endType').value,rounds:$('#rounds')?+$('#rounds').value:s.rounds,target:$('#target')?+$('#target').value:s.target,questionMode:$('#mode').value});$('#endType').onchange=()=>{send('lobby','settings',{endType:$('#endType').value,rounds:s.rounds,target:s.target,questionMode:$('#mode').value})};['rounds','target','mode'].forEach(id=>{let e=$('#'+id);if(e)e.onchange=update});$('#start').onclick=()=>{update();setTimeout(()=>send('lobby','start'),100)}}}
function namescore(){let g=room.game;return `<div class="scoreboard">${room.players.map(p=>`<div class="score">${esc(p.name)}<b>${g.scores[p.id]||0}</b>点</div>`).join('')}</div>`}
function rankEditor(items,buttonLabel,onclick){draft=(draft.length===5&&draft.every(x=>items.includes(x)))?draft:[...items];setTimeout(()=>bindRank(onclick),0);return `<div class="ranklist">${draft.map((x,i)=>`<div class="rankrow"><div class="rankno">${i+1}位</div><div class="rankname">${esc(x)}</div><button class="btn outline small" data-up="${i}" ${i===0?'disabled':''}>▲</button><button class="btn outline small" data-down="${i}" ${i===4?'disabled':''}>▼</button></div>`).join('')}<button id="rankOk" class="btn primary">${buttonLabel}</button></div>`}
function bindRank(onclick){document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;[draft[i-1],draft[i]]=[draft[i],draft[i-1]];renderGame()});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;[draft[i+1],draft[i]]=[draft[i],draft[i+1]];renderGame()});$('#rankOk').onclick=onclick}
function renderGame(){let g=room.game;if(!g)return;let me=room.players.find(p=>p.name===currentName)||room.players.find(p=>p.id===room.hostId&&room.isHost);let myId=room.viewerId;let isParent=myId===g.parentId;let body='';if(g.phase==='parent_candidates'){body=isParent?`<div class="parent">あなたが親です。お題に合う候補を5個入力してください。</div><div class="candidate-inputs">${[0,1,2,3,4].map(i=>`<input id="c${i}" maxlength="30" placeholder="候補${i+1}">`).join('')}<button id="candOk" class="btn primary">候補を確定</button></div>`:`<div class="waiting">${esc(g.parentName)}さんが候補を考えています…</div>`;setTimeout(()=>{if(isParent)$('#candOk').onclick=()=>{let c=[0,1,2,3,4].map(i=>$('#c'+i).value.trim());send('game','set_candidates',{candidates:c})}},0)}else if(g.phase==='parent_rank'){body=isParent?`<div class="parent">あなたの本当のランキングを作ってください。</div>${rankEditor(g.candidates,'ランキングを確定',()=>send('game','parent_rank',{ranking:draft}))}`:`<div class="waiting">${esc(g.parentName)}さんがランキングを決めています…</div>`}else if(g.phase==='guess'){if(isParent)body=`<div class="waiting">みんながあなたのランキングを予想しています… ${g.answered.length}/${room.players.length-1}人</div>`;else if(g.myAnswer)body=`<div class="waiting">予想確定済みです。ほかのプレイヤーを待っています… ${g.answered.length}/${room.players.length-1}人</div>`;else body=`<div class="parent">${esc(g.parentName)}さんのランキングを予想してください。</div>${rankEditor(g.candidates,'予想を確定',()=>send('game','guess',{ranking:draft}))}`}else if(g.phase==='reveal'){let correct=g.reveal.ranking;body=`<h2 style="text-align:center">答え合わせ</h2><div class="answer-card"><h3>👑 ${esc(g.parentName)}さんのランキング</h3>${correct.map((x,i)=>`<div>${i+1}位　<b>${esc(x)}</b></div>`).join('')}</div><div class="reveal-grid">${room.players.filter(p=>p.id!==g.parentId).map(p=>{let a=g.reveal.answers[p.id]||[];return`<div class="answer-card"><h3>${esc(p.name)}　<span class="match">+${g.reveal.roundScores[p.id]||0}点</span></h3>${a.map((x,i)=>`<div>${i+1}位　${esc(x)} ${x===correct[i]?'✓':''}</div>`).join('')}</div>`}).join('')}</div>${room.isHost?'<div class="actions"><button id="next" class="btn primary">次へ</button></div>':'<div class="waiting">ホストが次へ進めます</div>'}`;setTimeout(()=>{if(room.isHost)$('#next').onclick=()=>{draft=[];send('game','next')}},0)}else if(g.phase==='finished'){let wins=room.players.filter(p=>g.winnerIds.includes(p.id)).map(p=>p.name);body=`<div class="winner">🏆 ${esc(wins.join('・'))}</div><div class="waiting">最終結果</div>${room.isHost?'<div class="actions"><button id="backLobby" class="btn primary">ロビーへ戻る</button></div>':''}`;setTimeout(()=>{if(room.isHost)$('#backLobby').onclick=()=>send('game','lobby')},0)}$('#app').innerHTML=`<section class="panel"><div class="gamehead"><div><b>第${g.round}ラウンド</b>　親：${esc(g.parentName)}</div><div>${g.mode==='full'?'完全ランダム':'お題だけランダム'}</div></div>${namescore()}<div class="question">${esc(g.question)}</div>${body}</section>`}
loadRooms();
</script></body></html>
